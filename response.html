<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Responses</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

  <div class="logo">Forms</div>

  <nav>
    <a href="index.html">Home</a>
  </nav>

</header>

<main class="container">

  <div id="heading"></div>

  <div id="responses"></div>

</main>

<script>

const params =
  new URLSearchParams(location.search);

const formId = params.get("id");

async function loadResponses() {

  const formResponse =
    await fetch(`/api/forms/${formId}`);

  const form =
    await formResponse.json();

  document.getElementById("heading").innerHTML = `

    <div class="page-header">

      <div>

        <h1>${escapeHtml(form.title)}</h1>

        <p>Form responses</p>

      </div>

      <a
        href="form.html?id=${formId}"
        class="primary-btn"
      >
        Open Form
      </a>

    </div>
  `;

  const response =
    await fetch(`/api/forms/${formId}/responses`);

  const responses =
    await response.json();

  const container =
    document.getElementById("responses");

  if (responses.length === 0) {

    container.innerHTML = `
      <div class="empty">
        <h2>No responses yet</h2>
        <p>Responses will appear here.</p>
      </div>
    `;

    return;
  }

  container.innerHTML = responses.map((response, ri) => `

    <div class="response-card">

      <div class="response-header">

        <strong>
          Response ${responses.length - ri}
        </strong>

        <small>
          ${new Date(response.created_at).toLocaleString()}
        </small>

      </div>

      ${form.questions.map((q, qi) => {

        const key = `q_${q.id}`;
        const answer = response.data[key];

        return `

          <div class="answer">

            <strong>
              ${escapeHtml(q.question)}
            </strong>

            <p>
              ${
                Array.isArray(answer)
                  ? answer.join(", ")
                  : escapeHtml(answer || "No answer")
              }
            </p>

          </div>

        `;

      }).join("")}

    </div>

  `).join("");
}

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    String(text ?? "");

  return div.innerHTML;
}

loadResponses();

</script>

</body>
</html>
